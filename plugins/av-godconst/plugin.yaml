name: av-godconst
version: 0.1.0
description: "GC-TELEGRAM-BALLOT (docs/GODCONST-TELEGRAM-BALLOT.md): the resident's God Constitution ballot as Telegram button cards from their own bot. While AV_GODCONST_BALLOT is on (written by the control plane from GODCONST_BALLOT_TENANTS), a pass every 60 s reads the resident's own ballot through the control plane (POST /tenants/<own tenant>/godconst/ballot with the box's EDGEOS_API_KEY; CONTROL_PLANE_URL pinned to CP_HOSTS; the control plane forwards to the app with the GODCONST bridge key) and, once the pool is rating, sends a header (village daytime only) and the statements in the resident's own order two at a time (a pair: one agent-written and one ODIN-written statement under the app's godconst-order-v2), five buttons 1..5 each (contracts.ts labels). One Telegram CallbackQueryHandler scoped to callback_data starting gcb: (ctx.register_platform_handler, block=False) accepts taps from the box's own resident in their own DM only (av-vote's rule) and saves each as one rating on the SAME ballot the /constitution page shows (POST .../godconst/ballot/rate; the app merges it per statement, last write wins); a re-tap is a revision; the next pair follows once the current one is rated; a final line when every statement is rated; Stop / Resume on the header; Submit my ratings (header, last card of each page, final line; confirmed first) submits the app's merged draft; an ending (submitted, closed, the window over, withdrawn) deletes the session and keeps a tombstone; an empty marker $HERMES_HOME/av-events/godconst/page-open exists while a sent page has unrated cards (touched on each page, removed on completion, Stop, every ending and at start when stale) so av-elicit holds its opener. A change on the web page re-marks the card on the next read. Never writes a statement text or a rating value to disk (the ledger av-godconst/ballot.json holds ids, positions and message ids; no value, mark or key), never injects anything into the agent's session, never emits an event, never logs anything but codes and counts. Fail-open: no tools, no hooks, never raises into the gateway."
author: Edge City
kind: backend
optional_env:
  - AV_GODCONST_BALLOT
  - CONTROL_PLANE_URL
  - EDGEOS_API_KEY
  - TELEGRAM_HOME_CHANNEL
  - AV_TENANT_ID
  - TENANT_ID
