# Mini-apps PR review, bot v0: the deterministic half of the PR-review bot
# (MINIAPPS-PLATFORM-v2-design.md §6.1, §6.3, §8 Phase 0 item 3). It runs
# scripts/mini-apps-review.ts over the pull request's diff and writes the §6.3
# JSON to the job summary and to an artifact named mini-apps-review.
#
# Conformance (release's owner read of P0-5, CLAIMS L14465): the script runs
# P0-5's suite itself, `bun scripts/mini-apps-conformance.ts <manifest> --base
# <PR base> --out ...`, on the changed manifest, and only when that script is
# in the checkout. A committed conformance.json is never trusted. The suite's
# output goes into the artifact too. The version-bump rule is reported (N) and
# not enforced until S2 is settled.
#
# Phase 0: dark and advisory. It is not a required check, it posts no comment
# (jmill's LLM half does that later), it holds no secret and no write token,
# and it never uses pull_request_target. Every verdict exits 0; only a broken
# bot (exit 2) fails the job, and then the report says FAIL with bot_error.
#
# Known limit: on pull_request GitHub runs this file, the script and the
# validator from the pull request's own checkout, so a pull request can edit its
# own gate. The script classes any pull request that touches them as core
# (NEEDS_HUMAN). The real gate is the cp's own copy of the validator plus branch
# protection on the catalog repo later (design §6.4).
name: mini-apps review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "mini-apps/**"
      - "skills/**"

permissions:
  contents: read

concurrency:
  group: mini-apps-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: mini-apps review (bot v0, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, never shallow or blob-less: the script diffs base...head from
      # their merge base, and P0-5's suite reads base blobs with git cat-file. The
      # script refuses (exit 2) a shallow or partial clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # no-cache: never restore bun from the Actions cache. The script needs no
      # packages (node: built-ins only), so there is no bun install.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      # The event's values go through env, never into the shell text.
      - name: Review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          bun scripts/mini-apps-review.ts --base "$BASE_SHA" --head "$HEAD_SHA" --author "$PR_AUTHOR" \
            --out "$RUNNER_TEMP/mini-apps-review.json" --summary "$RUNNER_TEMP/mini-apps-review.md" \
            --conformance-dir "$RUNNER_TEMP/mini-apps-conformance"
      - name: Job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mini-apps-review.md" ]; then cat "$RUNNER_TEMP/mini-apps-review.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$RUNNER_TEMP/mini-apps-review.json" ]; then
            { echo; echo '```json'; cat "$RUNNER_TEMP/mini-apps-review.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The review wrote no report: the bot could not run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mini-apps-review
          path: |
            ${{ runner.temp }}/mini-apps-review.json
            ${{ runner.temp }}/mini-apps-conformance/
          if-no-files-found: warn
          retention-days: 14
